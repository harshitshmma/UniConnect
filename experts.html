<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Experts - UniConnect</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url("https://images.unsplash.com/photo-1519389950473-47ba0277781c") no-repeat center center/cover;
      color: white;
      height: 100vh;
      text-align: center;
    }

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
    }

    .content {
      position: relative;
      top: 100px;
    }

    h1 {
      font-size: 40px;
    }

    input {
      padding: 12px;
      width: 300px;
      border-radius: 8px;
      border: none;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 8px;
      background: #00c6ff;
      color: white;
      cursor: pointer;
    }

    .results {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 12px;
      width: 250px;
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<div class="content">
  <h1>Find Your Expert</h1>
  <p>Search the profession you are looking for</p>

  <input id="searchInput" placeholder="e.g. Python, Web Developer">
  <button onclick="searchExperts()">Search</button>

  <div class="results" id="results"></div>
</div>

<!-- 🔥 FIREBASE + SEARCH -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBLq48sgaucUPrjNKwer7n9mNQlErN1ArA",
    authDomain: "edu-table-a66a1.firebaseapp.com",
    projectId: "edu-table-a66a1",
    storageBucket: "edu-table-a66a1.firebasestorage.app",
    messagingSenderId: "449265365903",
    appId: "1:449265365903:web:c4d659b2127a13ab94d1fa"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const resultsDiv = document.getElementById("results");

  window.searchExperts = async function () {
    const keyword = document.getElementById("searchInput").value.toLowerCase();
    resultsDiv.innerHTML = "";

    const snapshot = await getDocs(collection(db, "users"));

    snapshot.forEach((doc) => {
      const data = doc.data();

      // ❗ Only show users with bio
      if (!data.bio) return;

      if (data.bio.toLowerCase().includes(keyword)) {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <h3>${data.name}</h3>
          <p>${data.university}</p>
          <p>${data.bio}</p>
        `;

        resultsDiv.appendChild(card);
      }
    });
  };
</script>

</body>
</html>
