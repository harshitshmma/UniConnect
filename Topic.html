<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Topic Experts - UniConnect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: url("https://images.unsplash.com/photo-1532094349884-543bc11b234d") no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 800px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 25px;
      color: #ddd;
    }

    /* TOPIC CARDS */
    .topics {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 25px;
    }

    .topic-card {
      padding: 12px 18px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    .topic-card:hover {
      background: #00c6ff;
      color: white;
      transform: scale(1.05);
    }

    /* SEARCH */
    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }

    button {
      margin-top: 15px;
      padding: 14px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #00c6ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0096c7;
    }

    .results {
      margin-top: 25px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      display: none;
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

  <h1>Which Topic Do You Want to Master?</h1>
  <p>Find the best topic expert for your learning</p>

  <!-- HIGHLIGHTED TOPICS -->
  <div class="topics">
    <div class="topic-card" onclick="quickSelect('Physics')">Physics (Any Topic)</div>
    <div class="topic-card" onclick="quickSelect('Chemistry')">Chemistry (Any Topic)</div>
    <div class="topic-card" onclick="quickSelect('Mathematics')">Mathematics (Any Topic)</div>
  </div>

  <!-- SEARCH -->
  <input 
    type="text" 
    id="topicInput" 
    placeholder="Search any topic you are looking master for (e.g. Algebra, Thermodynamics)"
  />

  <button onclick="searchTopic()">Search Topic Expert</button>

  <!-- RESULT -->
  <div class="results" id="resultsBox">
    <p id="resultText"></p>
  </div>

</div>

<script>
  function quickSelect(topic) {
    document.getElementById("topicInput").value = topic;
  }

  function searchTopic() {
    const topic = document.getElementById("topicInput").value;

    if (!topic) {
      alert("Enter a topic");
      return;
    }

    localStorage.setItem("topicSearch", topic);

    document.getElementById("resultsBox").style.display = "block";
    document.getElementById("resultText").innerText =
      "Searching for '" + topic + "' experts...\n\n(No data yet — will connect database soon)";
  }
</script>

</body>
</html>
